apiVersion: apps/v1 
kind: Deployment
metadata:
  name: quotes-api 
spec:
  replicas: 6
  selector:
    matchLabels:
      app: quotes-api 
  template:
    metadata:
      labels:
        app: quotes-api 
    spec:
      containers:
        - name: quotes-api
          image: quotes-api:demo
          imagePullPolicy: Never
          ports:
            - containerPort: 3000