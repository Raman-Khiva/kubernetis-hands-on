services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  quote-1:
    build: .
    restart: unless-stopped
    environment:
      INSTANCE_NAME: quote-1
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  quote-2:
    build: .
    restart: unless-stopped
    environment:
      INSTANCE_NAME: quote-2
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  quote-3:
    build: .
    restart: unless-stopped
    environment:
      INSTANCE_NAME: quote-3
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  # Single hostname in front of all three.
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - quote-1
      - quote-2
      - quote-3
