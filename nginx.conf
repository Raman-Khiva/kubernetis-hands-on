events {}

http {
  upstream quote_backends {
    # Round-robin across the three API replicas.
    server quote-1:3000;
    server quote-2:3000;
    server quote-3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://quote_backends;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Pass through so curl -i shows which replica answered.
      proxy_pass_header X-Instance;
    }
  }
}
